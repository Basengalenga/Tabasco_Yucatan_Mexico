services:
  db:
    image: postgis/postgis:16-3.4
    container_name: yucatan_dw
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: yucatan_dw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d yucatan_dw"]
      interval: 5s
      timeout: 5s
      retries: 10

  dashboard:
    build: ./dashboard
    container_name: yucatan_dashboard
    environment:
      DB_URL: postgresql+psycopg2://admin:admin123@db:5432/yucatan_dw
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: